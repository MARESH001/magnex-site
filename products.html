<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Magnex International Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=21">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23072a3d'/><g transform='translate(10 22) scale(.8)'><path d='M99.9 55.2 L82.6 38.9 L82.1 47.9 L74.6 47.8 L74.5 0.0 L50.4 25.0 L49.8 3.0 L0.0 55.2 L21.6 55.3 L34.3 42.3 L34.5 55.3 L49.9 55.3 L50.1 48.1 L58.7 39.0 L59.5 55.4 Z' fill='%232ea7db'/></g></svg>">

<body>

<section class="phead">
  <div class="wrap">
    <nav class="crumb"><a href="index.html">Home</a><i>›</i><b>Products</b></nav>
    <div class="phead__body">
      <div>
        <p class="eyebrow">Export Portfolio</p>
        <h1 class="h-section">Everything We Trade</h1>
        <p>Ten categories of Indian agricultural commodities, every one supplied against buyer-approved specifications with export documentation handled in-house.</p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="catgrid" id="catGrid"></div>
  </div>
</section>

<script src="assets/js/data.js?v=16"></script>
<script src="assets/js/textures.js?v=8"></script>
<script src="assets/js/widgets.js?v=9"></script>
<script>
function pageInit() {
  document.getElementById("catGrid").innerHTML = Object.entries(CATALOG).map(([cid, c]) => {
    const count = c.groups.reduce((a, g) => a + g.products.length, 0);
    return `
    <a class="catcard rv" href="category.html?cat=${cid}">
      <div class="catcard__sw">${c.photo ? `<img src="${c.photo}" alt="${c.name}" loading="lazy">` : `<canvas data-tex="${c.texture}" data-seed="idx-${cid}"></canvas>`}</div>
      <div class="catcard__t">${c.name}</div>
      <div class="catcard__d">${c.desc}</div>
      <div class="catcard__c">${count} products · ${c.tagline}</div>
    </a>`;
  }).join("");
}
</script>
<script src="assets/js/main.js?v=14"></script>
</body>
</html>
